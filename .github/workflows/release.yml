name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows package
        shell: pwsh
        run: .\build.ps1 -Force -Installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaCamViewer-windows-installer
          path: dist/installer/TeslaCamViewer-*-windows-x64-setup.exe

  macos:
    name: macOS package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-latest
            artifact: TeslaCamViewer-macos-arm64-package
          - name: Intel
            runner: macos-15-intel
            artifact: TeslaCamViewer-macos-x64-package

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build macOS package
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh --force --dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/installer/TeslaCamViewer-*-macos-*.*

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success'

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          overwrite_files: true
